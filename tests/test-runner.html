<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borb RPG — Unit Test Runner</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #050608;
      color: #f4f5f7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.5;
    }
    h1 { color: #f5a623; margin: 0 0 8px; font-size: 20px; }
    .summary {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #323747;
      background: #0e1017;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .summary.pass { border-color: #38c976; color: #38c976; }
    .summary.fail { border-color: #ef5350; color: #ef5350; }
    .row {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #1e2230;
      background: #0c0e14;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .row.pass .badge { color: #38c976; }
    .row.fail { border-color: #ef5350; background: #1a0f12; }
    .row.fail .badge { color: #ef5350; }
    .err { color: #ff9a96; margin-top: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Borb RPG Tracker — Automated Unit Test Suite</h1>
  <div id="summary" class="summary">Running tests…</div>
  <div id="output"></div>

  <script type="module">
    import { runAllTests } from './unit.test.js';

    const summaryEl = document.getElementById('summary');
    const outputEl = document.getElementById('output');

    runAllTests().then((report) => {
      window.__TEST_REPORT__ = report;
      document.title = report.failed === 0
        ? `PASS (${report.passed}/${report.total}) — Borb Tests`
        : `FAIL (${report.failed}/${report.total}) — Borb Tests`;

      summaryEl.className = `summary ${report.failed === 0 ? 'pass' : 'fail'}`;
      summaryEl.textContent = `${report.failed === 0 ? 'ALL TESTS PASSED' : 'TESTS FAILED'}: ${report.passed}/${report.total} passed, ${report.failed} failed`;

      outputEl.innerHTML = report.results.map((r) => `
        <div class="row ${r.passed ? 'pass' : 'fail'}">
          <div>
            <span class="badge">[${r.passed ? 'PASS' : 'FAIL'}]</span>
            <strong>${r.suite}</strong> — ${r.name}
            ${r.error ? `<div class="err">${r.error}</div>` : ''}
          </div>
          <span style="color:#686f82;">${r.durationMs}ms</span>
        </div>
      `).join('');
    }).catch((err) => {
      summaryEl.className = 'summary fail';
      summaryEl.textContent = `RUNNER CRASH: ${err?.stack || err}`;
    });
  </script>
</body>
</html>
